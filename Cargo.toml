[workspace]
resolver = "2"
members = ["src-tauri", "crates/cirrus-core", "crates/cirrus-mcp"]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "Apache-2.0"
authors = ["cirrus"]
rust-version = "1.88.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["sync", "fs", "time", "macros", "rt-multi-thread", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "stream", "rustls-tls"] }
futures-util = "0.3"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
rand = "0.8"
regex = "1"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
aes-gcm = "0.10"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

cookie = "0.18"
cookie_store = { version = "0.22", features = ["serde_json"] }
plist = "1.10.1"
flate2 = "1.1"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
toml_edit = "0.25"


tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
