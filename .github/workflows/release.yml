name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Linux ARM64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed automatic updates." >&2
            exit 1
          fi
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cirrus ${{ github.ref_name }}
          releaseBody: |
            Cirrus ${{ github.ref_name }}

            ### 更新内容

            - 修复设备位置地址偶发不显示：后端优先解析，高德不可用时自动切换 OpenStreetMap
            - 地图初始化不再阻塞地址查询，高德 JS 回调异常时会在超时后继续降级
            - 设备坐标变化后会自动刷新地址详情
            - 更新日志会过滤内部实现引用

            ### Highlights

            - Fixed intermittent missing device addresses with backend-first lookup and OpenStreetMap fallback
            - Map initialization no longer blocks address lookup; stalled AMap JS callbacks time out cleanly
            - Device details now refresh when coordinates change
            - Release notes now omit internal implementation references

            Native iCloud desktop client for Windows, macOS, and Linux.
            These builds are not notarized. macOS may show a Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.mcp.conf.json


  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/updater"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/updater" --clobber
          node - "$RUNNER_TEMP/updater/latest.json" "$TAG" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedVersion = process.argv[3].replace(/^v/, '');
          const required = [
            'windows-x86_64',
            'darwin-aarch64',
            'darwin-x86_64',
            'linux-x86_64',
            'linux-aarch64',
          ];
          if (manifest.version !== expectedVersion) {
            throw new Error(`latest.json version ${manifest.version} does not match ${expectedVersion}`);
          }
          const missing = required.filter((platform) => {
            const entry = manifest.platforms?.[platform];
            return !entry?.url || !entry?.signature;
          });
          if (missing.length > 0) {
            throw new Error(`latest.json is missing required platforms: ${missing.join(', ')}`);
          }
          console.log(`Verified ${required.length} updater platforms for ${manifest.version}`);
          NODE
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest