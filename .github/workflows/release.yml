name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Linux ARM64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed automatic updates." >&2
            exit 1
          fi
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cirrus ${{ github.ref_name }}
          releaseBody: |
            Cirrus ${{ github.ref_name }}

            ### 更新内容

            自 1.5.0 起的更新：

            - 修复 Codex stdio 配置残留 HTTP 字段导致 MCP 无法启动的问题
            - MCP 桥接改用单一 `mcp-bridge.json` 发现文件，并兼容旧版端口/令牌文件
            - 自动写入的客户端配置会传递 `CIRRUS_DATA_DIR`，支持便携和自定义数据目录
            - 修复地图初始化时无效坐标导致 `Invalid Object: Pixel(NaN, NaN)` 的问题
            - 地图初始化会等待容器尺寸就绪，并新增坐标校验、错误分类和重试按钮

            ### Highlights

            Changes since 1.5.0:

            - Fixed Codex stdio startup failures caused by stale HTTP fields in the MCP configuration
            - Moved MCP bridge discovery to a single `mcp-bridge.json` while retaining legacy port/token compatibility
            - Client configurations written by Cirrus now pass `CIRRUS_DATA_DIR` for portable and custom data directories
            - Fixed map initialization failures reported as `Invalid Object: Pixel(NaN, NaN)`
            - Map startup now waits for a visible container and adds coordinate validation, clearer errors, and retry controls

            Native iCloud desktop client for Windows, macOS, and Linux.
            These builds are not notarized. macOS may show a Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 5
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.mcp.conf.json
      - name: Preserve updater manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: latest.json
          if-no-files-found: error
          retention-days: 1


  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download updater manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: ${{ runner.temp }}/updater-fragments
      - name: Merge updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/merge-updater-manifests.mjs "$RUNNER_TEMP/updater-fragments" "$RUNNER_TEMP/latest.json" "$TAG"
      - name: Upload merged updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
