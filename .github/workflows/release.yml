name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Linux ARM64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed automatic updates." >&2
            exit 1
          fi
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cirrus ${{ github.ref_name }}
          releaseBody: |
            Cirrus ${{ github.ref_name }}

            ### 更新内容

            自 1.5.1 起的更新：

            - MCP 已完全改为 direct-only，移除桌面 bridge、`mcp-bridge*.json` 运行时发现文件和自动回退
            - stdio 与 Streamable HTTP 都直接使用本地数据库与加密会话保险库
            - 移除 MCP 登录工具，工具集调整为 27 个；请先在 Cirrus 桌面端重新登录一次以写入完整会话
            - 设备 artwork 与照片缩略图默认使用原生 MCP 图片内容块直接渲染
            - `structuredContent` 不再重复携带图片 Base64
            - 清理旧 bridge 文件并移除相关环境变量和兼容路径

            ### Highlights

            Changes since 1.5.1:

            - MCP is now direct-only: the desktop bridge, `mcp-bridge*.json` runtime discovery files, and fallback paths were removed
            - Both stdio and Streamable HTTP read the local database and encrypted session vault directly
            - Removed the MCP login tool for a 27-tool surface; sign in through the Cirrus desktop app once to persist a complete session
            - Device artwork and photo thumbnails now render through native MCP image content blocks by default
            - `structuredContent` no longer duplicates image Base64 payloads
            - Legacy bridge files are cleaned up and bridge-specific environment variables and compatibility paths are removed

            Native iCloud desktop client for Windows, macOS, and Linux.
            These builds are not notarized. macOS may show a Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 5
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.mcp.conf.json
      - name: Preserve updater manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: latest.json
          if-no-files-found: error
          retention-days: 1


  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download updater manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: ${{ runner.temp }}/updater-fragments
      - name: Merge updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/merge-updater-manifests.mjs "$RUNNER_TEMP/updater-fragments" "$RUNNER_TEMP/latest.json" "$TAG"
      - name: Upload merged updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
