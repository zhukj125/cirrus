name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Linux ARM64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed automatic updates." >&2
            exit 1
          fi
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cirrus ${{ github.ref_name }}
          releaseBody: |
            Cirrus ${{ github.ref_name }}

            ### 更新内容

            自 1.4.9 起的更新：

            - 修复并优化触控板地图手势：标准双指缩放、平移和缩放识别更平滑
            - MCP 设备列表新增激活锁状态、最后定位时间和数据获取时间
            - 设备图片默认返回稳定 URL，并在首段文本摘要中提供 Markdown 图片兜底
            - 可选用 `includeArtwork: dataUri` 返回原生内联图片，避免客户端折叠图片块后完全不可见
            - 修复客户端继承本机代理或沙箱设置时 MCP 桥接连接失败的问题

            ### Highlights

            Changes since 1.4.9:

            - Restored standard trackpad pinch zoom and smoothed map pan and zoom gestures
            - Added Activation Lock status, last location update, and fetch time to MCP device results
            - Device artwork now defaults to stable URLs with a Markdown image fallback in the first text block
            - Optional `includeArtwork: dataUri` returns native inline images for clients that collapse image content blocks
            - Fixed MCP bridge connection failures when clients inherit local proxy or sandbox settings

            Native iCloud desktop client for Windows, macOS, and Linux.
            These builds are not notarized. macOS may show a Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 5
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.mcp.conf.json
      - name: Preserve updater manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: latest.json
          if-no-files-found: error
          retention-days: 1


  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download updater manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: ${{ runner.temp }}/updater-fragments
      - name: Merge updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/merge-updater-manifests.mjs "$RUNNER_TEMP/updater-fragments" "$RUNNER_TEMP/latest.json" "$TAG"
      - name: Upload merged updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
