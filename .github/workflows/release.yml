name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Linux ARM64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cirrus ${{ github.ref_name }}
          releaseBody: |
            Cirrus ${{ github.ref_name }}

            ### 更新内容

            - 完整 MCP 集成：19 个工具、逐账户与逐工具权限控制、原生授权登录
            - 多页签工作区，页面切换时保留搜索、筛选和选中状态
            - 支持 Claude Code、Cursor、Codex、VS Code、Windsurf 等 13 个 MCP 客户端配置
            - AMap 英文底图与英文地址解析，中英文界面分别使用对应地图语言
            - 完善备忘录、联系人、日历、设备、照片和下载操作闭环
            - 重新整理“关于”页面、README 文案和模拟数据产品截图

            原生 iCloud 照片、设备与个人资料桌面客户端，支持 Windows、macOS、Linux。
            构建未做 Apple 公证，macOS 可能显示 Gatekeeper 警告。

            ### Highlights

            - Complete MCP integration with 19 tools, per-account and per-tool controls, and native authorization
            - Multi-tab workspace that preserves search, filters, and selection state
            - One-click MCP setup for Claude Code, Cursor, Codex, VS Code, Windsurf, and other clients
            - English AMap tiles and English reverse-geocoded addresses alongside localized Chinese maps
            - Complete workflows for devices, photos, downloads, notes, contacts, and calendar
            - Refreshed About page, README copy, and simulated-data product screenshots

            Native iCloud desktop client for Windows, macOS, and Linux.
            These builds are not notarized. macOS may show a Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.mcp.conf.json

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
