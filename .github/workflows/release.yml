name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Linux ARM64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed automatic updates." >&2
            exit 1
          fi
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Cirrus ${{ github.ref_name }}
          releaseBody: |
            Cirrus ${{ github.ref_name }}

            ### 更新内容

            自 1.4.8 起的更新：

            - 新增 Google 地图支持，可在设置中切换高德地图 / Google 地图并分别保存 API Key；Google 地图在中国大陆可能不可用
            - MCP 引擎支持独立安装、更新、重装和卸载；Streamable HTTP 改为主进程内置，stdio 启动器不再弹出控制台窗口
            - 修复打包版地图拖动，改进滚轮与触控板缩放，并区分触控板平移和缩放手势
            - 照片时间线日期标题现在会显示年份
            - 优化 MCP 传输方式标签、摘要卡片与地图文案布局

            ### Highlights

            Changes since 1.4.8:

            - Added Google Maps support with provider selection and separate API credentials in Settings; Google Maps may be unavailable in mainland China
            - The MCP engine can now be installed, updated, reinstalled, or removed independently; Streamable HTTP runs in-process, and the stdio launcher no longer opens a console window
            - Restored map dragging in packaged builds, refined wheel and touchpad zoom, and separated trackpad pan and zoom gestures
            - Photo timeline day headings now include the year
            - Polished MCP transport tabs, summary cards, and map copy layout

            Native iCloud desktop client for Windows, macOS, and Linux.
            These builds are not notarized. macOS may show a Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 5
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.mcp.conf.json
      - name: Preserve updater manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: latest.json
          if-no-files-found: error
          retention-days: 1


  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download updater manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: ${{ runner.temp }}/updater-fragments
      - name: Merge updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/merge-updater-manifests.mjs "$RUNNER_TEMP/updater-fragments" "$RUNNER_TEMP/latest.json" "$TAG"
      - name: Upload merged updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
